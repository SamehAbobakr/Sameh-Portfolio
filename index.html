<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sameh Abobakr</title>
    <meta name="description" content="Personal portfolio of Sameh Abobakr: cybersecurity, web development and agricultural engineering." />
    <meta property="og:title" content="Sameh Abobakr" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Cairo is the Arabic font (400 body, 500 medium, 600 sub-headings, 700 headings). Google Fonts only sends
         the Arabic/Latin pieces a page actually uses. English uses Inter, bundled locally via @fontsource. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" />
    <script>
      // Apply saved theme/language before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = 'dark'; // dark premium is the default look
        document.documentElement.dataset.theme = t;
        var l = localStorage.getItem('lang') || 'ar';
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
